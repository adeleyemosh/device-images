name: Update device images

on:
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape + convert + regenerate manifest
        id: update
        continue-on-error: true
        run: python scripts/update.py --all --update-marketing-names

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ manifest.json device_marketing_names.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(catalog): scheduled GSMArena rescan"
            git push
          fi

      - name: Fail job if update script errored
        if: steps.update.outcome == 'failure'
        run: exit 1
